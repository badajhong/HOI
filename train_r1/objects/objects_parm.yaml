# Per-object randomization ranges for object-interaction training.
#
# Friction ranges are sampled by IsaacLab material randomization.
# mass_distribution_params is passed to randomize_rigid_body_mass with operation="add",
# so the sampled value is added to the object's default URDF mass.

defaults:
  static_friction_range: [0.3, 1.6]
  dynamic_friction_range: [0.3, 1.2]
  restitution_range: [0.0, 0.5]
  mass_distribution_params: [1.0, 4.0]
  inertia_distribution_params_dict:
    Ixx: [0.5, 1.5]
    Iyy: [0.5, 1.5]
    Izz: [0.5, 1.5]
    Ixy: [0.5, 1.5]
    Iyz: [0.5, 1.5]
    Ixz: [0.5, 1.5]

objects:
  suitcase:
    static_friction_range: [0.1, 0.2]
    dynamic_friction_range: [0.05, 0.2]
    restitution_range: [0.0, 1.0]
    mass_distribution_params: [1.0, 4.0]

  smalltable:
    static_friction_range: [0.3, 2.0]
    dynamic_friction_range: [0.3, 1.2]
    restitution_range: [0.0, 0.5]
    mass_distribution_params: [1.0, 4.0]

  whitechair:
    static_friction_range: [0.3, 2.0]
    dynamic_friction_range: [0.3, 1.2]
    restitution_range: [0.0, 0.5]
    mass_distribution_params: [1.0, 4.0]

  largebox:
    static_friction_range: [0.3, 1.6]
    dynamic_friction_range: [0.3, 1.2]
    restitution_range: [0.0, 0.5]
    mass_distribution_params: [1.0, 4.0]

  plasticbox:
    static_friction_range: [0.3, 1.0]
    dynamic_friction_range: [0.3, 1.0]
    restitution_range: [0.0, 0.5]
    mass_distribution_params: [0.5, 2.0]

  trashcan:
    static_friction_range: [0.3, 1.6]
    dynamic_friction_range: [0.3, 1.2]
    restitution_range: [0.0, 0.5]
    mass_distribution_params: [1.0, 4.0]
